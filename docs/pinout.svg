<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="ui-monospace,Menlo,monospace">
  <style>
    .bg       { fill: #0f1115; }
    .board    { fill: #1a1f2b; stroke: #2a3142; stroke-width: 2; }
    .mcu      { fill: #2a3142; stroke: #3a4358; stroke-width: 1.5; }
    .usb      { fill: #2a3142; stroke: #3a4358; }
    .label    { fill: #cdd3e0; font-size: 13px; }
    .title    { fill: #f4f6fb; font-size: 22px; font-weight: 700; }
    .sub      { fill: #8a94aa; font-size: 12px; }
    .legend-t { fill: #f4f6fb; font-size: 14px; font-weight: 600; }
    .pinno    { fill: #f4f6fb; font-size: 12px; font-weight: 600; }
    .role     { fill: #cdd3e0; font-size: 12px; }
    .pad      { stroke: #3a4358; stroke-width: 1; }

    .c-power  { fill: #e74c3c; }
    .c-gnd    { fill: #6b7383; }
    .c-i2c    { fill: #16a085; }
    .c-relay  { fill: #c0392b; }
    .c-led    { fill: #f1c40f; }
    .c-btn    { fill: #3498db; }
    .c-sense  { fill: #9b59b6; }
    .c-avoid  { fill: #4a4f5e; }
    .c-spare  { fill: #2c3140; }

    .swatch   { stroke: #3a4358; stroke-width: 1; }
    .legtxt   { fill: #cdd3e0; font-size: 13px; }
  </style>

  <rect class="bg" width="1400" height="900"/>

  <text class="title" x="40" y="40">ESP32-S3-N16R8 — Carviston controller pinout</text>
  <text class="sub"   x="40" y="62">Pin numbers reflect silkscreen on the user's specific board. MCU at top, dual USB at bottom.</text>

  <!-- Board outline -->
  <rect class="board" x="500" y="100" width="400" height="720" rx="10"/>

  <!-- MCU shield -->
  <rect class="mcu" x="610" y="120" width="180" height="160" rx="6"/>
  <text class="label" x="700" y="200" text-anchor="middle" font-weight="700" fill="#f4f6fb">ESP32-S3</text>
  <text class="sub"   x="700" y="220" text-anchor="middle">N16R8</text>
  <text class="sub"   x="700" y="238" text-anchor="middle">16 MB flash · 8 MB PSRAM</text>

  <!-- USB connectors -->
  <rect class="usb" x="620" y="790" width="80" height="22" rx="3"/>
  <text class="sub" x="660" y="806" text-anchor="middle">USB-C</text>
  <rect class="usb" x="710" y="790" width="80" height="22" rx="3"/>
  <text class="sub" x="750" y="806" text-anchor="middle">USB µ-B</text>

  <!-- LEFT SIDE pads -->
  <g>
    <rect class="pad c-power" x="480" y="125" width="40" height="14"/>
    <rect class="pad c-power" x="480" y="155" width="40" height="14"/>
    <rect class="pad c-avoid" x="480" y="185" width="40" height="14"/>
    <rect class="pad c-spare" x="480" y="215" width="40" height="14"/>
    <rect class="pad c-spare" x="480" y="245" width="40" height="14"/>
    <rect class="pad c-i2c"   x="480" y="275" width="40" height="14"/>
    <rect class="pad c-i2c"   x="480" y="305" width="40" height="14"/>
    <rect class="pad c-led"   x="480" y="335" width="40" height="14"/>
    <rect class="pad c-btn"   x="480" y="365" width="40" height="14"/>
    <rect class="pad c-btn"   x="480" y="395" width="40" height="14"/>
    <rect class="pad c-btn"   x="480" y="425" width="40" height="14"/>
    <rect class="pad c-led"   x="480" y="455" width="40" height="14"/>
    <rect class="pad c-avoid" x="480" y="485" width="40" height="14"/>
    <rect class="pad c-avoid" x="480" y="515" width="40" height="14"/>
    <rect class="pad c-led"   x="480" y="545" width="40" height="14"/>
    <rect class="pad c-led"   x="480" y="575" width="40" height="14"/>
    <rect class="pad c-led"   x="480" y="605" width="40" height="14"/>
    <rect class="pad c-led"   x="480" y="635" width="40" height="14"/>
    <rect class="pad c-led"   x="480" y="665" width="40" height="14"/>
    <rect class="pad c-led"   x="480" y="695" width="40" height="14"/>
    <rect class="pad c-power" x="480" y="725" width="40" height="14"/>
    <rect class="pad c-gnd"   x="480" y="755" width="40" height="14"/>

    <!-- pin numbers (silkscreen) -->
    <text class="pinno" x="470" y="136" text-anchor="end">3V3</text>
    <text class="pinno" x="470" y="166" text-anchor="end">3V3</text>
    <text class="pinno" x="470" y="196" text-anchor="end">RST</text>
    <text class="pinno" x="470" y="226" text-anchor="end">IO4</text>
    <text class="pinno" x="470" y="256" text-anchor="end">IO5</text>
    <text class="pinno" x="470" y="286" text-anchor="end">IO6</text>
    <text class="pinno" x="470" y="316" text-anchor="end">IO7</text>
    <text class="pinno" x="470" y="346" text-anchor="end">IO15</text>
    <text class="pinno" x="470" y="376" text-anchor="end">IO16</text>
    <text class="pinno" x="470" y="406" text-anchor="end">IO17</text>
    <text class="pinno" x="470" y="436" text-anchor="end">IO18</text>
    <text class="pinno" x="470" y="466" text-anchor="end">IO8</text>
    <text class="pinno" x="470" y="496" text-anchor="end">IO3</text>
    <text class="pinno" x="470" y="526" text-anchor="end">IO46</text>
    <text class="pinno" x="470" y="556" text-anchor="end">IO9</text>
    <text class="pinno" x="470" y="586" text-anchor="end">IO10</text>
    <text class="pinno" x="470" y="616" text-anchor="end">IO11</text>
    <text class="pinno" x="470" y="646" text-anchor="end">IO12</text>
    <text class="pinno" x="470" y="676" text-anchor="end">IO13</text>
    <text class="pinno" x="470" y="706" text-anchor="end">IO14</text>
    <text class="pinno" x="470" y="736" text-anchor="end">5Vin</text>
    <text class="pinno" x="470" y="766" text-anchor="end">GND</text>

    <!-- role labels — kept inside their own column with plenty of room -->
    <text class="role" x="420" y="136" text-anchor="end">3V3 rail</text>
    <text class="role" x="420" y="166" text-anchor="end">3V3 rail</text>
    <text class="role" x="420" y="196" text-anchor="end">RESET</text>
    <text class="role" x="420" y="226" text-anchor="end">spare</text>
    <text class="role" x="420" y="256" text-anchor="end">spare</text>
    <text class="role" x="420" y="286" text-anchor="end">I²C SDA → ADS1115</text>
    <text class="role" x="420" y="316" text-anchor="end">I²C SCL → ADS1115</text>
    <text class="role" x="420" y="346" text-anchor="end">LED ECO</text>
    <text class="role" x="420" y="376" text-anchor="end">BTN POWER</text>
    <text class="role" x="420" y="406" text-anchor="end">BTN ECO</text>
    <text class="role" x="420" y="436" text-anchor="end">BTN SHOWER</text>
    <text class="role" x="420" y="466" text-anchor="end">LED POWER</text>
    <text class="role" x="420" y="496" text-anchor="end">strapping — avoid</text>
    <text class="role" x="420" y="526" text-anchor="end">strapping — avoid</text>
    <text class="role" x="420" y="556" text-anchor="end">LED TEMP 40°C</text>
    <text class="role" x="420" y="586" text-anchor="end">LED TEMP 50°C</text>
    <text class="role" x="420" y="616" text-anchor="end">LED TEMP 60°C</text>
    <text class="role" x="420" y="646" text-anchor="end">LED TEMP 70°C</text>
    <text class="role" x="420" y="676" text-anchor="end">LED TEMP 80°C</text>
    <text class="role" x="420" y="706" text-anchor="end">LED SHOWER</text>
    <text class="role" x="420" y="736" text-anchor="end">+5 V from SMPS</text>
    <text class="role" x="420" y="766" text-anchor="end">GND</text>
  </g>

  <!-- RIGHT SIDE pads -->
  <g>
    <rect class="pad c-avoid" x="880" y="125" width="40" height="14"/>
    <rect class="pad c-avoid" x="880" y="155" width="40" height="14"/>
    <rect class="pad c-spare" x="880" y="185" width="40" height="14"/>
    <rect class="pad c-spare" x="880" y="215" width="40" height="14"/>
    <rect class="pad c-relay" x="880" y="245" width="40" height="14"/>
    <rect class="pad c-btn"   x="880" y="275" width="40" height="14"/>
    <rect class="pad c-btn"   x="880" y="305" width="40" height="14"/>
    <rect class="pad c-spare" x="880" y="335" width="40" height="14"/>
    <rect class="pad c-spare" x="880" y="365" width="40" height="14"/>
    <rect class="pad c-avoid" x="880" y="395" width="40" height="14"/>
    <rect class="pad c-avoid" x="880" y="425" width="40" height="14"/>
    <rect class="pad c-avoid" x="880" y="455" width="40" height="14"/>
    <rect class="pad c-avoid" x="880" y="485" width="40" height="14"/>
    <rect class="pad c-avoid" x="880" y="515" width="40" height="14"/>
    <rect class="pad c-spare" x="880" y="545" width="40" height="14"/>
    <rect class="pad c-relay" x="880" y="575" width="40" height="14"/>
    <rect class="pad c-sense" x="880" y="605" width="40" height="14"/>
    <rect class="pad c-avoid" x="880" y="635" width="40" height="14"/>
    <rect class="pad c-avoid" x="880" y="665" width="40" height="14"/>
    <rect class="pad c-gnd"   x="880" y="695" width="40" height="14"/>
    <rect class="pad c-gnd"   x="880" y="725" width="40" height="14"/>
    <rect class="pad c-gnd"   x="880" y="755" width="40" height="14"/>

    <text class="pinno" x="930" y="136">TX</text>
    <text class="pinno" x="930" y="166">RX</text>
    <text class="pinno" x="930" y="196">IO1</text>
    <text class="pinno" x="930" y="226">IO2</text>
    <text class="pinno" x="930" y="256">IO42</text>
    <text class="pinno" x="930" y="286">IO41</text>
    <text class="pinno" x="930" y="316">IO40</text>
    <text class="pinno" x="930" y="346">IO39</text>
    <text class="pinno" x="930" y="376">IO38</text>
    <text class="pinno" x="930" y="406">IO37</text>
    <text class="pinno" x="930" y="436">IO36</text>
    <text class="pinno" x="930" y="466">IO35</text>
    <text class="pinno" x="930" y="496">IO0</text>
    <text class="pinno" x="930" y="526">IO45</text>
    <text class="pinno" x="930" y="556">IO48</text>
    <text class="pinno" x="930" y="586">IO47</text>
    <text class="pinno" x="930" y="616">IO21</text>
    <text class="pinno" x="930" y="646">IO20</text>
    <text class="pinno" x="930" y="676">IO19</text>
    <text class="pinno" x="930" y="706">GND</text>
    <text class="pinno" x="930" y="736">GND</text>
    <text class="pinno" x="930" y="766">GND</text>

    <text class="role" x="980" y="136">UART0 — avoid</text>
    <text class="role" x="980" y="166">UART0 — avoid</text>
    <text class="role" x="980" y="196">spare</text>
    <text class="role" x="980" y="226">spare</text>
    <text class="role" x="980" y="256">RELAY 2 → driver Q2</text>
    <text class="role" x="980" y="286">BTN MINUS</text>
    <text class="role" x="980" y="316">BTN PLUS</text>
    <text class="role" x="980" y="346">spare</text>
    <text class="role" x="980" y="376">spare</text>
    <text class="role" x="980" y="406">PSRAM — do NOT use</text>
    <text class="role" x="980" y="436">PSRAM — do NOT use</text>
    <text class="role" x="980" y="466">PSRAM — do NOT use</text>
    <text class="role" x="980" y="496">strapping — avoid</text>
    <text class="role" x="980" y="526">strapping — avoid</text>
    <text class="role" x="980" y="556">spare</text>
    <text class="role" x="980" y="586">RELAY 1 → driver Q1</text>
    <text class="role" x="980" y="616">CUTOFF-SENSE (ext div)</text>
    <text class="role" x="980" y="646">USB D+ — do NOT use</text>
    <text class="role" x="980" y="676">USB D- — do NOT use</text>
    <text class="role" x="980" y="706">GND</text>
    <text class="role" x="980" y="736">GND</text>
    <text class="role" x="980" y="766">GND</text>
  </g>

  <!-- LEGEND at bottom -->
  <g transform="translate(40,840)">
    <text class="legend-t" x="0" y="0">Legend</text>
    <g transform="translate(0,12)">
      <rect class="swatch c-i2c"   x="0"   y="0" width="18" height="14"/>
      <text class="legtxt"         x="26"  y="11">I²C bus</text>
      <rect class="swatch c-relay" x="130" y="0" width="18" height="14"/>
      <text class="legtxt"         x="156" y="11">Relay drive</text>
      <rect class="swatch c-sense" x="280" y="0" width="18" height="14"/>
      <text class="legtxt"         x="306" y="11">Cutoff sense</text>
      <rect class="swatch c-led"   x="430" y="0" width="18" height="14"/>
      <text class="legtxt"         x="456" y="11">LED</text>
      <rect class="swatch c-btn"   x="530" y="0" width="18" height="14"/>
      <text class="legtxt"         x="556" y="11">Button</text>
      <rect class="swatch c-power" x="650" y="0" width="18" height="14"/>
      <text class="legtxt"         x="676" y="11">Power rail</text>
      <rect class="swatch c-gnd"   x="790" y="0" width="18" height="14"/>
      <text class="legtxt"         x="816" y="11">GND</text>
      <rect class="swatch c-avoid" x="870" y="0" width="18" height="14"/>
      <text class="legtxt"         x="896" y="11">Reserved (PSRAM/USB/strap/UART)</text>
    </g>
    <g transform="translate(0,40)">
      <rect class="swatch c-spare" x="0"   y="0" width="18" height="14"/>
      <text class="legtxt"         x="26"  y="11">Free for future use</text>
    </g>
  </g>

  <!-- Quick reference column on the RIGHT -->
  <g transform="translate(1180,100)">
    <text class="legend-t" x="0" y="0">ADS1115 @ 0x48</text>
    <text class="legtxt"   x="0" y="22">SDA  →  IO6  (4.7 kΩ pull-up)</text>
    <text class="legtxt"   x="0" y="40">SCL  →  IO7  (4.7 kΩ pull-up)</text>
    <text class="legtxt"   x="0" y="58">ADDR →  GND</text>
    <text class="legtxt"   x="0" y="80">AIN0 = Probe A reg</text>
    <text class="legtxt"   x="0" y="98">AIN1 = Probe A safety</text>
    <text class="legtxt"   x="0" y="116">AIN2 = Probe B reg</text>
    <text class="legtxt"   x="0" y="134">AIN3 = Probe B safety</text>

    <text class="legend-t" x="0" y="180">Free pins</text>
    <text class="legtxt"   x="0" y="202">IO1, IO2, IO4, IO5,</text>
    <text class="legtxt"   x="0" y="220">IO38, IO39, IO48</text>

    <text class="legend-t" x="0" y="260">Safety</text>
    <text class="legtxt"   x="0" y="282">KSD301 in BOTH coil rails</text>
    <text class="legtxt"   x="0" y="300">Each relay: own Q + diode</text>
    <text class="legtxt"   x="0" y="318">300 ms stagger (FW)</text>
    <text class="legtxt"   x="0" y="336">95 °C soft cutoff (FW)</text>
    <text class="legtxt"   x="0" y="354">IO21: ext divider only —</text>
    <text class="legtxt"   x="0" y="372">no internal pull-up</text>
    <text class="legtxt"   x="0" y="390">Mains / 3V3 isolated</text>
    <text class="legtxt"   x="0" y="408">single-point GND</text>
  </g>
</svg>
