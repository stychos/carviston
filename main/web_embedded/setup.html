<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Carviston</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1a1f2e 0%, #0d1117 100%); color: #e6edf3;
  }
  .card {
    width: min(420px, 92vw); background: #161b22; padding: 28px;
    border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.4);
    border: 1px solid #30363d;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 22px; }
  label { display: block; margin: 10px 0 4px; font-size: 13px; color: #c9d1d9; }
  input, button {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #30363d;
    background: #0d1117; color: #e6edf3; font: inherit;
  }
  button {
    margin-top: 16px; background: #2f81f7; color: #fff; border: 0; cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #4493f8; }
  button.ghost { background: transparent; color: #8b949e; margin-top: 8px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .err { color: #f85149; margin-top: 10px; font-size: 13px; min-height: 1.2em; }
  .dash { display: grid; gap: 14px; }
  .stat { display: flex; justify-content: space-between; padding: 10px 12px;
          background: #0d1117; border-radius: 8px; }
  .temps button { background: #21262d; color: #e6edf3; }
  .temps button.active { background: #2f81f7; }
  .small { font-size: 12px; color: #8b949e; }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('cvt') || '';
const api = async (path, opts = {}) => {
  opts.headers = Object.assign({'Content-Type': 'application/json'}, opts.headers || {});
  if (token) opts.headers.Authorization = 'Bearer ' + token;
  const r = await fetch(path, opts);
  if (r.status === 401) { token=''; localStorage.removeItem('cvt'); render(); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error(await r.text() || ('HTTP ' + r.status));
  return r.headers.get('content-type')?.includes('json') ? r.json() : r.text();
};
const fmtErr = (e) => (e && e.message) || String(e);

async function render() {
  const st = await api('/api/auth/status').catch(() => ({configured: false, authenticated: false}));
  if (!st.configured) return renderSetup();
  if (!st.authenticated) return renderLogin();
  return renderDash();
}

function renderSetup() {
  $('app').innerHTML = `
    <h1>Set admin password</h1>
    <div class="sub">First boot — choose a password for this device.</div>
    <label>Password</label><input type="password" id="pw" autofocus />
    <label>Confirm</label><input type="password" id="pw2" />
    <button id="go">Save and continue</button>
    <div class="err" id="err"></div>
    <div class="small" style="margin-top: 20px;">
      This is the built-in fallback UI. Flash the Vue bundle to <code>web</code> partition for the full app.
    </div>`;
  $('go').onclick = async () => {
    const p = $('pw').value, p2 = $('pw2').value;
    $('err').textContent = '';
    if (p.length < 4) return $('err').textContent = 'Password must be 4+ chars';
    if (p !== p2) return $('err').textContent = 'Passwords do not match';
    try {
      await api('/api/auth/setup', { method: 'POST', body: JSON.stringify({ password: p }) });
      const r = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ password: p }) });
      token = r.token; localStorage.setItem('cvt', token);
      render();
    } catch (e) { $('err').textContent = fmtErr(e); }
  };
}

function renderLogin() {
  $('app').innerHTML = `
    <h1>Carviston</h1>
    <div class="sub">Sign in to continue.</div>
    <label>Password</label><input type="password" id="pw" autofocus />
    <button id="go">Sign in</button>
    <div class="err" id="err"></div>`;
  $('pw').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
  $('go').onclick = async () => {
    $('err').textContent = '';
    try {
      const r = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ password: $('pw').value }) });
      token = r.token; localStorage.setItem('cvt', token);
      render();
    } catch (e) { $('err').textContent = 'Wrong password'; }
  };
}

const TEMPS = [40, 50, 60, 70, 80];
async function renderDash() {
  $('app').innerHTML = `
    <h1>Dashboard</h1>
    <div class="sub" id="wifi"></div>
    <div class="dash">
      <div class="stat"><span>Water temperature</span><b id="t">—</b></div>
      <div class="stat"><span>Heaters</span><b id="h">—</b></div>
      <div class="stat"><span>Safety</span><b id="s">—</b></div>
      <div class="stat"><span>Shower ready</span><b id="r">—</b></div>
      <div>
        <label>Target</label>
        <div class="row temps" id="row"></div>
      </div>
      <div class="row">
        <button id="pwr">Toggle heaters</button>
      </div>
    </div>
    <button class="ghost" id="out">Sign out</button>`;
  $('out').onclick = async () => {
    try { await api('/api/auth/logout', { method: 'POST' }); } catch {}
    token=''; localStorage.removeItem('cvt'); render();
  };
  $('pwr').onclick = () => api('/api/heater/power', { method: 'POST', body: '{}' });
  TEMPS.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t + '°C'; b.dataset.t = t;
    b.onclick = () => api('/api/heater/target', { method: 'POST', body: JSON.stringify({ celsius: t }) });
    $('row').appendChild(b);
  });
  refresh();
  setInterval(refresh, 1500);
}

async function refresh() {
  try {
    const s = await api('/api/state');
    $('t').textContent = (s.water_c != null && !isNaN(s.water_c)) ? s.water_c.toFixed(1) + '°C' : 'sensor fault';
    $('h').textContent = `${s.heater_active[0] ? '1' : '–'} / ${s.heater_active[1] ? '2' : '–'}`;
    $('s').textContent = s.safety === 0 ? 'OK' : 'fault #' + s.safety;
    $('r').textContent = s.shower_ready ? 'yes' : 'no';
    $('wifi').textContent = s.wifi_ssid ? `WiFi: ${s.wifi_ssid} (${s.wifi_rssi} dBm)` : 'WiFi: AP mode';
    document.querySelectorAll('.temps button').forEach(b => {
      b.classList.toggle('active', +b.dataset.t === s.target_c);
    });
  } catch {}
}
render();
</script>
</body>
</html>
